<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zadanie 9 - Zadanie problemowe</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    section {
      display: flex;
      gap: 10px;
      padding: 20px;
      background: #fff;
      border: 2px solid #000;
    }

    .box {
      width: 120px;
      height: 120px;
      border: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      background: #ddd;
    }

    .a { flex-direction: row; }
    .b { flex-direction: row-reverse; }
    .c { flex-direction: column; }
    .d { flex-direction: column-reverse; }
    .e {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 500px;
      width: 500px;
    }
  </style>
</head>
<body>
  <h2>A) 1 2 3 4</h2>
  <section class="a">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>

  <h2>B) 4 3 2 1</h2>
  <section class="b">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>

  <h2>C) 1 / 2 / 3 / 4</h2>
  <section class="c">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>

  <h2>D) 4 / 3 / 2 / 1</h2>
  <section class="d">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>

  <h2>E) wyśrodkowany układ pionowy</h2>
  <section class="e">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>
</body>
</html>
