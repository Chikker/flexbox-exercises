<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zadanie 8 - Układ kolumnowy i justify-content</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #431407, #c2410c, #f59e0b);
      color: white;
    }

    .topbar {
      background: rgba(67, 20, 7, 0.45);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 30px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .nav a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      transition: 0.25s;
    }

    .nav a:hover,
    .nav a.active {
      background: #fb923c;
      border-color: #fb923c;
      color: #431407;
      transform: translateY(-2px);
    }

    main {
      min-height: calc(100vh - 90px);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 30px;
      flex-wrap: wrap;
    }

    .column {
      width: 300px;
      height: 420px;
      border: 3px solid white;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 12px;
    }

    .center { justify-content: center; }
    .between { justify-content: space-between; }

    .box {
      width: 110px;
      height: 60px;
      margin: 10px auto;
      border: 2px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #fbbf24, #f97316);
      border-radius: 12px;
    }

    .opis {
      max-width: 420px;
      line-height: 1.7;
      font-size: 1.05rem;
      background: rgba(255,255,255,0.1);
      padding: 20px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Flexbox</div>
    <nav class="nav">
      <a href="zadanie1.html">1</a>
      <a href="zadanie2.html">2</a>
      <a href="zadanie3.html">3</a>
      <a href="zadanie4.html">4</a>
      <a href="zadanie5.html">5</a>
      <a href="zadanie6.html">6</a>
      <a href="zadanie7.html">7</a>
      <a href="zadanie8.html" class="active">8</a>
      <a href="zadanie9.html">9</a>
      <a href="zadanie10.html">10</a>
    </nav>
  </div>

  <main>
    <div class="column center">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <div class="column between">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <div class="opis">
      <p><strong>justify-content: center</strong> umieszcza elementy w środku kontenera.</p>
      <p><strong>justify-content: space-between</strong> rozdziela je równomiernie, przesuwajac pierwszy i ostatni na skraj.</p>
    </div>
  </main>
</body>
</html>
