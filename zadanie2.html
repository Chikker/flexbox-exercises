<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zadanie 2 - Idealne wyśrodkowanie</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    section {
      width: auto;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 2px solid #000;
      padding: 20px;
      background: #eaeaea;
    }

    .box {
      width: 150px;
      height: 150px;
      border: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      background: white;
    }
  </style>
</head>
<body>
  <section>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>
</body>
</html>
