<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zadanie 3 - Odwrócona kolejność</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f8f8;
      font-family: Arial, sans-serif;
    }

    section {
      display: flex;
      flex-direction: row-reverse;
      gap: 10px;
    }

    .box {
      width: 150px;
      height: 150px;
      border: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      background: #fff;
    }
  </style>
</head>
<body>
  <section>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </section>
</body>
</html>
