<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zadanie 1 - Podstawowy układ Flexbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #3b82f6, #8b5cf6);
      color: white;
    }

    .topbar {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 30px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .nav a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      transition: 0.25s;
    }

    .nav a:hover,
    .nav a.active {
      background: #f97316;
      border-color: #f97316;
      transform: translateY(-2px);
    }

    main {
      min-height: calc(100vh - 90px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .panel {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 22px;
      padding: 35px 40px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    h2 {
      margin-bottom: 24px;
      font-size: 2rem;
    }

    section {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .box {
      width: 150px;
      height: 150px;
      border: 3px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Flexbox</div>
    <nav class="nav">
      <a href="zadanie1.html" class="active">1</a>
      <a href="zadanie2.html">2</a>
      <a href="zadanie3.html">3</a>
      <a href="zadanie4.html">4</a>
      <a href="zadanie5.html">5</a>
      <a href="zadanie6.html">6</a>
      <a href="zadanie7.html">7</a>
      <a href="zadanie8.html">8</a>
      <a href="zadanie9.html">9</a>
      <a href="zadanie10.html">10</a>
    </nav>
  </div>

  <main>
    <div class="panel">
      <h2>Zadanie 1</h2>
      <section>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
      </section>
    </div>
  </main>
</body>
</html>
